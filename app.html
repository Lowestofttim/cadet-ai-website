<!DOCTYPE html>

<head>
  <meta charset="utf-8">

  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; object-src 'none'; script-src 'none'; style-src 'self'; img-src 'self'; form-action 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <!-- Handoff page for the verified App Link https://cadetai.co.uk/app :
       Android with Cadet AI installed opens the APP directly and never sees
       this page. Everyone else lands here and picks their store. There is no
       meta-refresh any more: Cadet AI shipped on iOS 2026-09-08, and blindly
       forwarding to Google Play sent iPhone users to the wrong shop. CSP here
       is script-src 'none', so this has to be a plain choice, not JS sniffing. -->
  <meta name="robots" content="noindex">
  <title>Open Cadet AI</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/app.css">
</head>

  <div class="card">
    <h1>Get Cadet AI</h1>
    <p>If the app didn&rsquo;t open, it isn&rsquo;t installed yet &mdash; it&rsquo;s free on both stores.</p>
    <a class="btn" href="https://apps.apple.com/gb/app/id6802644162">Download on the App Store</a>
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.cadetai.app">Get it on Google Play</a>
    <nav class="links" aria-label="Legal and support links">
      <a href="privacy.html">Privacy Policy</a>

      <a href="delete-account.html">Account deletion</a>
      <a href="mailto:support@cadetai.co.uk">support@cadetai.co.uk</a>
    </nav>
  </div>
</body>
</html>
