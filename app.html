<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Handoff page for the verified App Link https://cadetai.co.uk/app :
       Android with Cadet AI installed opens the APP directly and never sees
       this page; everyone else lands here and is sent to Google Play. -->
  <meta name="robots" content="noindex">
  <title>Open Cadet AI</title>
  <link rel="icon" href="/favicon.ico">
  <meta http-equiv="refresh" content="2;url=https://play.google.com/store/apps/details?id=com.cadetai.app">
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #10140e; color: #f2f4ef;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center; padding: 24px;
    }
    .card { max-width: 26rem; }
    h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
    p { color: #b9c0b2; line-height: 1.5; margin: 0 0 1.25rem; }
    a.btn {
      display: inline-block; background: #b6cf8e; color: #1c2413;
      font-weight: 700; text-decoration: none; padding: .8rem 1.6rem;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Opening Cadet AI&hellip;</h1>
    <p>If the app doesn't open, it isn't installed yet &mdash; grab it free on Google Play.</p>
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.cadetai.app">Get Cadet AI on Google Play</a>
  </div>
</body>
</html>
